name: Coletar e conciliar fontes oficiais
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coleta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Garantir extrator PDF com pacotes assinados
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - run: pip install -r requirements.txt
      - run: python scripts/coletar.py
      - run: python scripts/cvm.py
      - run: python scripts/ampliar_fontes.py --permitir-snapshot-dirbi
      - run: python scripts/evoluir_v2.py --online --permitir-snapshot
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: evidencias-coleta
          path: |
            data/conciliacao_v2.json
            data/coleta_v2_status.json
            data/complementos_revisados.json
            data/conciliacao_expandida.json
            data/extracao_validada.json
            data/coletas.json
            data/conciliacao_cvm.json
            data/cvm_empresa_2025.csv
            public/data/painel.json
          retention-days: 7
